[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-filament-segmentation"
version = "0.1.0"
description = "Instance segmentation pipeline for solar filaments in H-alpha full-disk images (Solar Filament Segmentation Challenge 2026)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "pycocotools>=2.0.7",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "torchvision>=0.16",
    "tqdm>=4.65",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "opencv-python>=4.8",
]
kaggle = [
    "kagglehub>=0.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
solar-filament = "solar_filament.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
